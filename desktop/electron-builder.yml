appId: mx.cocina.desktop
productName: Cocina
copyright: Cocina
directories:
  app: build/app
  output: release
  buildResources: resources
# Sin asar: tesseract.js lanza un worker_thread desde su carpeta
asar: false
electronVersion: 44.9.0
# better-sqlite3 trae binarios N-API (Mac Intel/Apple, Windows) que sirven en Electron sin recompilar
npmRebuild: false
mac:
  category: public.app-category.business
  # Los binarios de ambas arquitecturas ya vienen incluidos; el build universal los deja tal cual
  x64ArchFiles: '**/better-sqlite3/prebuilds/**'
  target:
    - target: dmg
  # Firma ad-hoc (sin cuenta de Apple Developer). Sin ninguna firma, las Mac con chip Apple dicen que la app
  # "está dañada" y no dejan abrirla; con ad-hoc basta con "Abrir de todos modos" la primera vez
  identity: '-'
  hardenedRuntime: false
dmg:
  title: Cocina
win:
  target:
    - target: nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
